name: itv-guest-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Bootstrap-суперпользователь образа. Приложение под ним не работает —
      # суперпользователь игнорирует RLS. Рабочие роли создаёт init-скрипт.
      POSTGRES_DB: ${POSTGRES_DB:-guestapp}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-guestapp}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-guestapp}
      PLATFORM_DB_USER: ${POSTGRES_PLATFORM_USER:-guestapp_platform}
      PLATFORM_DB_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD:-guestapp_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-guestapp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_HOST_PORT:-59000}:9000"        # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-59001}:9001" # web-консоль
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: ["api"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHANNELS_REDIS_URL: redis://redis:6379/3
      CACHE_URL: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
      # Коннектор — отдельный сервис, но он же и часть монорепо. Его пакет
      # виден backend'у ТОЛЬКО ради тестов round-trip: они обязаны гонять
      # настоящий исполнитель коннектора, а не его копию. В проде backend
      # этот код не импортирует.
      PYTHONPATH: /app:/connector
    volumes:
      - ./backend:/app
      - ./connector:/connector:ro
      # Только ради демо-сида: рендер плана номера и замеры геометрии лежат в
      # концепте, а не в ассетах приложения. Читается один раз при засеве и
      # уезжает в MinIO тем же медиапайплайном, что и загрузка из CMS.
      - ./docs:/docs:ro
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: ./backend
    command: ["worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHANNELS_REDIS_URL: redis://redis:6379/3
      CACHE_URL: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5183}:5173"
    depends_on:
      - backend

  # --- GRMS: эмулятор iRidi и коннектор ------------------------------------
  # Оба под профилем `grms`: обычный `docker compose up` их не поднимает.
  # Эмулятор изображает оборудование, и молча запускать его вместе со стендом
  # значило бы однажды перепутать его с настоящим объектом.

  iridi-emulator:
    profiles: ["grms"]
    build: ./backend
    # Чистый stdlib, поэтому запускается тем же образом, что и backend, но
    # ничего из Django не импортирует.
    command: ["python", "-m", "apps.grms.emulator"]
    environment:
      IRIDI_EMULATOR_PORT: "1085"
    volumes:
      - ./backend:/app
    ports:
      - "${IRIDI_EMULATOR_PORT:-1085}:1085"

  connector:
    profiles: ["grms"]
    build: ./connector
    # Узел обязан подниматься сам после перезагрузки сервера объекта —
    # инженер туда не поедет.
    restart: unless-stopped
    environment:
      ITV_CONNECTOR_CONFIG: /etc/itv-connector/config.json
      # Ключ узла выдаётся в админке платформы и в конфиг НЕ пишется:
      # конфиг попадает в бэкапы и логи развёртывания, ключ — не должен.
      ITV_CONNECTOR_KEY: "${ITV_CONNECTOR_KEY:-}"
    volumes:
      - ./connector/config.dev.json:/etc/itv-connector/config.json:ro
    depends_on:
      - backend
      - iridi-emulator

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
