[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
# Прогон идёт в четыре процесса: 1:22:52 → 0:29:05. У каждого процесса своя
# база (pytest-django добавляет к имени суффикс воркера), поэтому тесты друг
# другу в базу не лезут. Отладка одного файла — с `-n 0`: четыре подготовки
# базы ради одного теста стоят дороже самого теста.
addopts = -ra --strict-markers -n 4
filterwarnings =
    ignore::DeprecationWarning
