<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ITV Guest App</title>

    <!-- PWA. `theme-color` is filled at runtime from the hotel's brand tokens
         (see AppThemeProvider) so that no color literal lives outside tokens.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ITV Guest" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Шрифты: Onest (дисплейный — заголовки, названия, цены) и Manrope
         (интерфейсный). Оба с кириллицей, стек описан в src/theme/tokens.ts.

         ЛЕЖАТ ЛОКАЛЬНО (public/fonts), а не приезжают с fonts.gstatic.com:
         внешняя ссылка означала, что фирменный шрифт доходит до гостя только
         при доступе в интернет с ЕГО устройства. В гостиничном Wi-Fi с
         закрытым внешним доступом — и на стенде в локальной сети — интерфейс
         рисовался системным шрифтом, то есть выглядел чужим ровно там, где
         его показывают. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-400-cyrillic.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
