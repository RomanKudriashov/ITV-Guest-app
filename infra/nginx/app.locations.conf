# Общие правила приложения: API, вебсокеты, медиа, SPA.
#
# ЛЕЖИТ ВНЕ conf.d НАМЕРЕННО: nginx подхватывает conf.d/*.conf сам, на уровне
# http, а `location` там недопустим — сервер не поднимается вовсе. Подключается
# только явным include из server-блока.
#
# ВЫНЕСЕНЫ В INCLUDE, потому что их два потребителя — server на 80 (пока нет
# сертификата) и server на 443. Две копии однажды разъехались бы, и разъехались
# бы молча: на одном порту работает, на другом нет.
    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- WebSocket (живой статус, чат трекера) ------------------------------
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- Медиа из MinIO (публичный бакет guest-media) ----------------------
    # Прикладные URL имеют вид /guest-media/<key>; проксируем прямо в MinIO,
    # порт наружу не публикуем.
    location /guest-media/ {
        proxy_pass http://minio;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --- Витрина/CMS/трекер (статичная SPA) --------------------------------
    # ЗАПАСНОЙ МАРШРУТ — ТОЛЬКО ДЛЯ АДРЕСОВ ЭКРАНОВ (партия 30, п.62 бэклога).
    # Раньше `try_files … /index.html` ловил любой путь, и отсутствующая
    # картинка отвечала 200 телом витрины: в журнале и замерах — успех, на
    # экране — не декодируется. Так полгода жили мёртвые заглушки (п.61).
    # Теперь отсутствующий файл статики, шрифта, медиа или любой путь с
    # расширением файла — 404; витрину получают только адреса экранов.
    # Расширения перечислены, а не «любая точка»: номер комнаты в `/r/1.05` —
    # адрес экрана, а не файл.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @screen;
    }

    location @screen {
        root /usr/share/nginx/html;
        if ($uri ~ "^/(static|media|fonts|assets|landing)/") {
            return 404;
        }
        if ($uri ~* "\.(js|mjs|css|map|json|webmanifest|txt|xml|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$") {
            return 404;
        }
        try_files /index.html =404;
    }
