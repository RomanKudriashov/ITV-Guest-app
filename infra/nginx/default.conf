# Реверс-прокси перед всем стендом: единственная точка входа снаружи.
# Домен нигде не захардкожен — сервер ловит любой Host (default_server), а
# разрешённые хосты проверяет Django (ALLOWED_HOSTS из APP_DOMAIN).
#
# TLS. Wildcard на sslip.io не выпустить, и он не нужен: сертификат выписан на
# СПИСОК имён — базовый домен и по одному на отель, HTTP-01 через webroot.
# Выпуск и продление — infra/nginx/enable-tls.sh, порядок в docs/ops/stand.md.
#
# ДВА РЕЖИМА, И ПЕРЕКЛЮЧАЕТ ИХ НАЛИЧИЕ ФАЙЛА, а не правка конфигурации.
# Пока сертификата нет, каталог live/ пуст: приложение отдаётся по HTTP прямо
# отсюда — иначе первый подъём упирался бы в курицу и яйцо, ведь ACME нужен
# живой nginx. Скрипт выпуска кладёт в live/ два файла, и порт 80 превращается
# в редирект, а приложение переезжает на 443.
#
# Приложение включается РОВНО ОДИН РАЗ в каждом режиме: два `location /` в
# одном server-блоке — это отказ старта, уже поймали.

upstream backend {
    server backend:8000;
}

# MinIO — только внутренняя сеть compose; наружу отдаём медиа через этот прокси.
upstream minio {
    server minio:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12m;

    # Проверка владения доменом. ДО всего остального и без редиректа: продление
    # не должно зависеть от того, куда мы шлём гостя.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Есть сертификат — здесь редирект на HTTPS, и приложения на 80 нет.
    include /etc/nginx/conf.d/live/redirect-to-https.conf*;
    # Нет сертификата — здесь приложение, и редиректа нет. Файл-переключатель
    # кладётся рядом с сертификатом и гасит эту ветку.
    include /etc/nginx/conf.d/live/http-app.off.conf*;
}

# Server на 443 появляется вместе с сертификатом.
include /etc/nginx/conf.d/live/tls.enabled.conf*;
