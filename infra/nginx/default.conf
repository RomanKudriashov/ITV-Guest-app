# Реверс-прокси перед всем стендом: единственная точка входа снаружи.
# Домен нигде не захардкожен — сервер ловит любой Host (default_server), а
# разрешённые хосты проверяет Django (ALLOWED_HOSTS из APP_DOMAIN). Поэтому
# смена sslip-заглушки на реальный домен — правка .env, не этого файла.
#
# TLS. Wildcard на sslip.io не выпустить, и он не нужен: сертификат выписан на
# СПИСОК конкретных имён (базовый домен + по одному на отель), HTTP-01. Список
# и порядок продления — в docs/ops/stand.md.
#
# Конфигурация одна на оба случая: если сертификата нет, файла
# `tls.enabled.conf` тоже нет, include его не подхватит, и стенд работает по
# HTTP. Так первый подъём не упирается в курицу и яйцо — nginx нужен живым,
# чтобы ACME смог подтвердить владение доменом.

upstream backend {
    server backend:8000;
}

# MinIO — только внутренняя сеть compose; наружу отдаём медиа через этот прокси.
upstream minio {
    server minio:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12m;

    # Проверка владения доменом. ДО всех остальных правил и без редиректа:
    # продление сертификата не должно зависеть от того, куда мы шлём гостя.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Появляется вместе с сертификатом (каталог примонтирован с хоста).
    include /etc/nginx/conf.d/live/redirect-to-https.conf*;
    include /etc/nginx/conf.d/app.locations.conf;
}

# Server на 443 появляется вместе с сертификатом: файла нет — блока нет.
include /etc/nginx/conf.d/live/tls.enabled.conf*;
