# ПОРЯДОК АДРЕСОВ В КОНТЕЙНЕРАХ СТЕНДА: IPv6 ПЕРВЫМ (05.10.2026).
#
# Со стенда api.telegram.org доступен только по IPv6. У
# контейнеров приватный IPv6 (fd3a:17c:91::/64, наружу — NAT66 Docker), а по
# умолчанию glibc (RFC 6724, правило 5 «совпадение меток») ставит пару
# «приватный IPv6 → публичный IPv6» ниже IPv4: бот сначала ждал IPv4 35 с и
# ловил таймаут. Здесь приватной подсети дана та же метка, что публичным
# адресам (fc00::/7 → 1), остальная таблица — умолчание glibc.
label  ::1/128        0
label  ::/0           1
label  2002::/16      2
label  ::/96          3
label  ::ffff:0:0/96  4
label  fec0::/10      5
label  fc00::/7       1
label  2001:0::/32    7

precedence  ::1/128       50
precedence  ::/0          40
precedence  2002::/16     30
precedence  ::/96         20
precedence  ::ffff:0:0/96 10
