# Прод-стенд, отдельный от dev docker-compose.yml.
# Наружу смотрит ТОЛЬКО nginx (:80). postgres/redis/minio портов не публикуют —
# доступны лишь во внутренней сети compose. Секреты — в .env.prod НА СЕРВЕРЕ
# (в репозиторий не коммитится).
#
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: itv-guest-prod

x-backend-env: &backend-env
  # Топология сети compose (не секреты) — общая для backend/worker/beat.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CHANNELS_REDIS_URL: redis://redis:6379/3
  # Кэш Django: погода, схлопывание чтений GRMS, троттлинг PIN. Задаётся ЗДЕСЬ,
  # рядом с остальной топологией, а не остаётся на умолчании из settings — там
  # localhost, и в контейнере это тихий 500 на гостевой главной вместо внятной
  # ошибки старта. Локальный компоуз его задавал, прод-компоуз забыл.
  CACHE_URL: redis://redis:6379/4
  MINIO_ENDPOINT: minio:9000
  # Почта. Без неё платформенная консоль не заводит отели и не сбрасывает
  # пароли: пароль администратора уходит ЕМУ письмом, и «отправить нечем» —
  # это отказ операции, а не тихий пропуск.
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@itv.local}

services:
  # Почтовый ящик стенда.
  #
  # ПОРТОВ НЕ ПУБЛИКУЕТ — и это главное. Стенд смотрит в интернет, а в письмах
  # лежат пароли администраторов отелей: открытая веб-морда означала бы, что
  # чужой пароль читает любой, кто знает адрес. Смотреть письма — через
  # SSH-туннель (см. /home/deploy/stand.md).
  #
  # Второй рубеж на случай, если порт однажды всё-таки опубликуют: своя
  # авторизация Mailpit. Один рубеж, который легко снять одной строкой в
  # компоузе, — это не рубеж.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "2000"
      MP_DATABASE: /data/mailpit.db
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?нужен логин:пароль для веб-морды почты}
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_DB_USER: ${POSTGRES_PLATFORM_USER}
      PLATFORM_DB_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build: ./backend
    command: ["api"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      <<: *backend-env
      UVICORN_RELOAD: "0"          # прод: без авто-перезагрузки
      WEB_CONCURRENCY: "3"
    healthcheck:
      # Готов = миграции применены и ASGI отвечает. start_period даёт время на
      # migrate + минимальный seed на первом старте.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      # Кадры и замеры демо-плана номера. Лежат в docs/, то есть ВНЕ backend/,
      # а в образ едет только backend/ — без этого сид тихо оставляет тип без
      # плана: он намеренно не падает из-за отсутствия демо-картинки, и стенд
      # поднимается с рабочим экраном номера, но без плана.
      # Только чтение и только на стенде: на объекте демо-рендеров нет.
      - ./docs/design/grms-concept:/docs/design/grms-concept:ro
      # Кэш демо-снимков. В образе он живёт внутри /app и умирает с каждой
      # пересборкой, а из контейнера этот CDN недоступен (IPv6 у хоста есть,
      # у docker-сети нет), поэтому заново кэш не наберётся — витрина молча
      # остаётся без фотографий. Каталог наполняется НА ХОСТЕ.
      - ./backend/apps/.seed_photos:/app/apps/.seed_photos
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    networks: [internal]

  worker:
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      <<: *backend-env
    volumes:
      # Кадры и замеры демо-плана номера. Лежат в docs/, то есть ВНЕ backend/,
      # а в образ едет только backend/ — без этого сид тихо оставляет тип без
      # плана: он намеренно не падает из-за отсутствия демо-картинки, и стенд
      # поднимается с рабочим экраном номера, но без плана.
      # Только чтение и только на стенде: на объекте демо-рендеров нет.
      - ./docs/design/grms-concept:/docs/design/grms-concept:ro
      # См. backend: кэш снимков живёт на хосте, иначе пропадает при пересборке.
      - ./backend/apps/.seed_photos:/app/apps/.seed_photos
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]

  beat:
    build: ./backend
    command: ["beat"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      <<: *backend-env
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Сертификаты и проверка владения доменом живут НА ХОСТЕ: они переживают
      # пересборку образа, а certbot ходит в тот же каталог.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./infra/nginx/live:/etc/nginx/conf.d/live:ro
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]

  # --- Управление номером ---------------------------------------------------
  #
  # На СТЕНДЕ, а не на объекте: здесь и коннектор, и «железо» живут в тех же
  # контейнерах. На живом объекте коннектор ставится на сервер отеля отдельно
  # (`connector/itv-connector.service`), а эмулятора нет вовсе — там настоящий
  # iRidi. Профиля у них нет намеренно: на стенде GRMS нужен всегда, а профиль
  # уже однажды стоил нам вечера — сервисы молча не поднимались обычным `up`.

  iridi-emulator:
    build: ./backend
    # Чистый stdlib: запускается тем же образом, что backend, но Django не
    # импортирует.
    command: ["python", "-m", "apps.grms.transport.emulator"]
    restart: unless-stopped
    environment:
      IRIDI_EMULATOR_PORT: "1085"
    networks: [internal]

  connector:
    build: ./connector
    restart: unless-stopped
    environment:
      ITV_CONNECTOR_CONFIG: /etc/itv-connector/config.json
      # Ключ узла выдаётся в платформенной консоли и в конфиг НЕ пишется:
      # конфиг попадает в бэкапы и в логи развёртывания, ключ — не должен.
      # ПЕРЕЖИВАЕТ ТОЛЬКО ПЕРЕЗАПУСК: пересоздание базы стирает узел, и ключ
      # надо перевыпустить, иначе коннектор уходит в рестарт-петлю, а гость
      # видит «управление номером недоступно» без внятной причины.
      ITV_CONNECTOR_KEY: "${ITV_CONNECTOR_KEY:-}"
    volumes:
      - ./connector/config.stand.json:/etc/itv-connector/config.json:ro
    depends_on:
      backend: {condition: service_healthy}
      iridi-emulator: {condition: service_started}
    networks: [internal]

volumes:
  mailpit_data:
  postgres_data:
  redis_data:
  minio_data:

networks:
  internal:
    driver_opts:
      # ЧЁРНАЯ ДЫРА PMTU. С MTU 1500 из контейнера открывался TCP (0.05 с), но
      # TLS-рукопожатие висело до таймаута: ClientHello уходит, а крупный ответ
      # с сертификатом обратно не доезжает, и ICMP «нужна фрагментация» до нас
      # не долетает. С хоста тот же адрес отвечает за 0.2 с — поэтому дефект и
      # выглядел как «Unsplash тормозит», а не как сеть.
      #
      # Следствие было тихое: сид не падает без картинки намеренно, и стенд
      # поднялся с витриной без фотографий.
      com.docker.network.driver.mtu: "1400"
    driver: bridge
